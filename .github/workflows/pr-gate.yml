name: PR Gate

# Server-side mirror of the local pre-push gate from the tatendaz-github skill.
# Catches anyone (human or agent) who bypassed the local checks.
#
# Split of responsibility with .github/workflows/ci.yml:
#   * pr-gate.yml owns *process*     — the docs/features + docs/summaries
#                                      entries, and "new code has new tests".
#   * ci.yml      owns *correctness* — tests, shell checks, lint.
#
# This file used to carry its own `tests` job. It was removed when ci.yml
# landed: ci.yml runs the same suite across six Python versions and two
# operating systems, so keeping a second `Tests` context here would have run
# the suite twice per PR and given branch protection two similarly-named
# check contexts to choose between. ci.yml is the single owner of testing.

on:
  pull_request:
    branches: [main, master]

# Least privilege. Both jobs only read the repository.
permissions:
  contents: read

# One in-flight run per PR ref; a superseded push cancels the earlier run.
# (The docs/readme-slim PR burned 8 complete PR Gate runs on 2026-07-25.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-gate:
    name: Docs gate (features + summaries)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Don't leave the job's GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false

      - name: Derive branch slug
        id: slug
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          branch="$HEAD_REF"
          slug="${branch#feat/}"
          slug="${slug#fix/}"
          slug="${slug#chore/}"
          slug="${slug#docs/}"
          slug="${slug#refactor/}"
          slug="${slug//\//-}"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "Branch slug: $slug"

      # Both checks look at the PR's own diff (files added/renamed vs the
      # base), so entries left in the tree by older branches can't satisfy
      # a new PR.
      #
      # The matching itself lives in .github/scripts/require-docs-entry.sh.
      # It compares the slug as a literal string rather than splicing it into
      # a `grep -E` pattern — a branch like `feat/c++parser` or `feat/x[1]`
      # used to fail a correctly authored PR — and it anchors the filename to
      # `<YYYY-MM-DD>-<slug>.md` so `docs/gallery` is no longer satisfied by
      # an unrelated `2026-01-01-picker-gallery.md`.
      - name: Require docs/features entry
        env:
          BRANCH_SLUG: ${{ steps.slug.outputs.slug }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --quiet
          ./.github/scripts/require-docs-entry.sh \
            docs/features "$BRANCH_SLUG" "origin/$BASE_REF...HEAD"

      - name: Require docs/summaries entry
        env:
          BRANCH_SLUG: ${{ steps.slug.outputs.slug }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --quiet
          ./.github/scripts/require-docs-entry.sh \
            docs/summaries "$BRANCH_SLUG" "origin/$BASE_REF...HEAD"

  coverage-for-new-code:
    name: New code has new tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Don't leave the job's GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false

      - name: Check that changed source files have changed tests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$BASE_REF"
          git fetch origin "$base"
          changed=$(git diff --name-only "origin/$base...HEAD")

          # Everything that is not itself a test, a doc, or CI plumbing.
          non_test=$(echo "$changed" | grep -Ev '(^|/)(tests|docs|\.github)/' || true)

          # The languages this repo actually ships. bin/claude-usage needs its
          # own arm: it is Python, but it has no .py extension.
          src_changed=$(echo "$non_test" \
            | grep -E '(\.(py|lua|sh|tmux)$|^bin/claude-usage$)' || true)

          # The shell layer gets its own rule. install.sh is the front door —
          # README and AGENTS.md both tell users *and autonomous agents* to
          # clone and run it unattended against their own $HOME — and until
          # tests/test_install.sh existed a PR could rewrite it with no test,
          # no lint and no gate at all. A shell change must come with a change
          # to the shell suite; a Python test does not cover install.sh.
          shell_src_changed=$(echo "$non_test" | grep -E '\.(sh|tmux)$' || true)
          shell_test_changed=$(echo "$changed" | grep -E '^tests/.*\.sh$' || true)

          test_changed=$(echo "$changed" | grep -E '(^|/)tests/' || true)

          status=0

          if [ -n "$src_changed" ] && [ -z "$test_changed" ]; then
            echo "::error::Source files changed but no test files changed:"
            echo "$src_changed"
            echo "Add tests covering the new behavior before merging."
            status=1
          fi

          if [ -n "$shell_src_changed" ] && [ -z "$shell_test_changed" ]; then
            echo "::error::Shell scripts changed but tests/*.sh did not:"
            echo "$shell_src_changed"
            echo "install.sh and uninstall.sh write to and delete from a"
            echo "stranger's \$HOME. Extend tests/test_install.sh to cover the"
            echo "change — run it locally with ./tests/test_install.sh"
            status=1
          fi

          # Reported as if-blocks, not `[ -n x ] && echo`: GitHub runs these
          # steps with `bash -e`, where a failing test at the head of an &&
          # list takes the whole step down.
          if [ -n "$src_changed" ]; then
            echo "Source changes:"; echo "$src_changed"
          else
            echo "Source changes: none"
          fi
          if [ -n "$shell_src_changed" ]; then
            echo "Shell changes:"; echo "$shell_src_changed"
          fi
          if [ -n "$test_changed" ]; then
            echo "Test changes:"; echo "$test_changed"
          else
            echo "Test changes: none"
          fi

          exit "$status"
