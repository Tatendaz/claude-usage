name: Dependabot auto-merge

# Auto-merge Dependabot PRs (ported from Tatendaz/Quant_Backtest_Platform,
# hardened 2026-08-01). Patch + minor bumps are approved and merged
# automatically after required checks pass; major bumps wait for a human.
# Repositories without required checks must merge manually. There is no
# fallback that bypasses unfinished checks.
on:
  pull_request:
    branches: [main, master]

# Dependabot-triggered runs get a read-only token by default; raise it so the
# job can approve and enable auto-merge on the PR. (Dependabot PR branches live
# in this repo, so this elevation is allowed — see GitHub's "Automating
# Dependabot" docs.)
permissions:
  contents: write
  pull-requests: write
  checks: read

# One run per PR; a new push supersedes the old run (whose merge would be
# rejected anyway by --match-head-commit below).
concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Dependabot auto-merge
    # Bind to the PR author, not github.actor — the author can't be spoofed by
    # a later pusher, which is the hardened check GitHub recommends for
    # Dependabot.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      # Approval first: satisfies branch protections that require one review.
      # Needs "Allow GitHub Actions to create and approve pull requests" in the
      # repo's Actions settings; continue-on-error keeps repos without that
      # setting (and without a review requirement) working.
      - name: Approve (patch + minor)
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        continue-on-error: true
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Fail closed when required checks are absent, failed, or time out.
      # gh exits nonzero when no required checks exist; the job timeout also
      # stops the workflow without reaching a merge command.
      - name: Merge (patch + minor)
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          set -euo pipefail
          gh pr checks "$PR_URL" --required --watch --fail-fast --interval 30
          gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
